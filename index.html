<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }</style>
<title>向日市ストーリー(骨組み)</title>
<style>
/* ===== CSS:見た目を決める部分 ===== */
:root{ --bamboo:#3f6b4f; --night:#1f2a44; --paper:#f3efe2; --gold:#c9a24b; --ink:#222; }
*{ box-sizing:border-box; }
body{ margin:0; background:#111; display:flex; justify-content:center; font-family:"Hiragino Sans","Yu Gothic",sans-serif; }
/* スマホ縦画面の枠 */
#app{ position:relative; width:100%; max-width:390px; height:100vh; max-height:760px; margin:auto; background:var(--paper); overflow:hidden; }
.screen{ display:none; position:absolute; inset:0; flex-direction:column; align-items:center; justify-content:center; padding:16px; }
.screen.active{ display:flex; }
h1{ color:var(--night); font-size:28px; margin:12px 0 24px; text-align:center; }
button{ font:inherit; cursor:pointer; border:2px solid var(--night); background:#fff; color:var(--night); border-radius:8px; padding:10px 20px; }
button:hover{ background:var(--gold); }
button:disabled{ opacity:.4; cursor:not-allowed; }
.chars{ display:flex; gap:24px; flex:1; align-items:center; }
.chara{ text-align:center; font-size:13px; }
.textbox{ width:100%; min-height:130px; background:#fff; border:2px solid var(--night); border-radius:8px; padding:12px; margin-bottom:8px; }
/* ホーム・マップ・会話で共通の上部バー */
#hud{ display:none; position:absolute; top:0; left:0; right:0; padding:10px 12px; align-items:center; gap:10px; background:var(--night); z-index:5; }
#hud.show{ display:flex; }
#menuBtn{ padding:4px 10px; }
.bar{ flex:1; height:14px; background:#fff; border-radius:7px; overflow:hidden; }
#barFill{ height:100%; width:0; background:var(--bamboo); transition:width .5s; }
#pct{ color:#fff; font-size:13px; min-width:38px; }
/* メニューウィンドウ(ボタンで展開) */
#menu{ display:none; position:absolute; top:46px; left:12px; z-index:6; flex-direction:column; gap:6px; background:#fff; border:2px solid var(--night); border-radius:8px; padding:8px; }
#menu.open{ display:flex; }
/* マップ */
.mapArea{ position:relative; width:100%; flex:1; margin-top:40px; background:#dfe8d2; border:2px solid var(--night); border-radius:8px; }
.pin{ position:absolute; transform:translate(-50%,-100%); text-align:center; font-size:12px; background:none; border:none; padding:0; }
.pin span{ display:block; background:#fff; border:1px solid var(--night); border-radius:6px; padding:2px 6px; }
.pin:hover{ background:none; }
.pin.locked{ opacity:.35; }
/* 会話(AIチャット) */
#log{ width:100%; flex:1; margin-top:40px; overflow-y:auto; background:#fff; border:2px solid var(--night); border-radius:8px; padding:8px; font-size:14px; }
#log p{ margin:6px 0; }
.chatRow{ display:flex; gap:6px; width:100%; margin-top:8px; }
.chatRow input{ flex:1; font:inherit; padding:8px; border:2px solid var(--night); border-radius:8px; }
</style>
</head>
<body>
<div id="app">

  <!-- ===== HTML:画面(部品)を全部ここに並べておく ===== -->

  <!-- 上部バー(ホーム・マップ・会話で表示) -->
  <div id="hud">
    <button id="menuBtn" onclick="toggleMenu()">☰</button>
    <div class="bar"><div id="barFill"></div></div>
    <span id="pct">0%</span>
  </div>
  <div id="menu">
    <button onclick="goMenu('map')">📍 マップ</button>
    <button onclick="goMenu('chat')">💬 会話</button>
    <button onclick="goMenu('home')">🏠 ホーム</button>
  </div>

  <!-- 1. タイトル -->
  <section id="title" class="screen active">
    <div class="chars" id="titleChara"></div>
    <h1>向日市ストーリー</h1>
    <button onclick="startGame()">ゲームスタート</button>
  </section>

  <!-- 2〜3, 6〜7. プロローグ / チュートリアル / バトル / ED はこの1画面を使い回す -->
  <section id="scene" class="screen">
    <div class="chars" id="sceneChars"></div>
    <div class="textbox"><span id="sceneText"></span></div>
    <button id="nextBtn" onclick="nextLine()">次へ</button>
  </section>

  <!-- 4. ホーム -->
  <section id="home" class="screen">
    <div class="chars"><div class="chara"><div id="homeChara"></div>かぐや</div></div>
    <p id="homeMsg">マップからスポットを選ぼう</p>
    <button onclick="show('map')">マップを開く</button>
  </section>

  <!-- 5. マップ -->
  <section id="map" class="screen">
    <div class="mapArea" id="mapArea"></div>
  </section>

  <!-- 会話(AIチャット) -->
  <section id="chat" class="screen">
    <div id="log"></div>
    <div class="chatRow">
      <input id="chatInput" placeholder="メッセージを入力" onkeydown="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()">送信</button>
    </div>
  </section>
</div>

<script>
/* ===== JavaScript:動きを決める部分 ===== */

/* --- 棒人間(仮のキャラ絵)。あとで画像に差し替える --- */
function stick(color){
  return `<svg width="70" height="110" viewBox="0 0 70 110" fill="none" stroke="${color}" stroke-width="3">
    <circle cx="35" cy="16" r="12"/><path d="M35 28V70M35 40L12 58M35 40L58 58M35 70L15 104M35 70L55 104"/></svg>`;
}
const CHARA = { 'かぐや':'#3f6b4f', '早良親王':'#7a3b3b', '崇徳天皇':'#5b3f7a', 'ガイド':'#1f2a44' };
function charaHTML(names){
  return names.map(n => `<div class="chara">${stick(CHARA[n])}<br>${n}</div>`).join('');
}

/* --- ストーリーの台本(ここを書き換えるとセリフが変わる) --- */
const SCENES = {
  prologue: { chars:['かぐや','ガイド'], next:()=>playScene('tutorial'), lines:[
    'むかしむかし、竹の里・向日の地に都がありました。',
    'あなたは、その都の謎を探す旅人です。',
  ]},
  tutorial: { chars:['かぐや','早良親王'], next:()=>{ setProgress(20); show('home'); }, lines:[
    'ここはホーム画面。左上の☰からメニューを開けます。',
    'マップでスポットを選ぶと、物語が進みます。',
  ]},
  battle1: { chars:['かぐや','崇徳天皇'], next:()=>{ cleared.add('長岡宮跡'); setProgress(50); show('map'); }, lines:[
    '(崇徳天皇があらわれた!)',
    '(ここにバトルや問答を入れる)',
  ]},
  boss: { chars:['かぐや','早良親王'], next:()=>{ cleared.add('資料館'); setProgress(80); playScene('ed'); }, lines:[
    '(早良親王があらわれた!)',
    '(ラストバトルをここに入れる)',
  ]},
  ed: { chars:['かぐや'], next:()=>{ setProgress(100); show('home'); $('homeMsg').textContent='おしまい。遊んでくれてありがとう!'; }, lines:[
    'こうして、都の謎は解き明かされました。',
    'おわり',
  ]},
};

/* --- マップのスポット(x,yは%位置)。activeがtrueのものだけ移動できる --- */
const SPOTS = [
  { name:'長岡宮跡', x:35, y:30, active:true,  scene:'battle1' },
  { name:'資料館',   x:60, y:65, active:true,  scene:'boss', after:'長岡宮跡' }, // 長岡宮跡クリア後に解放
  { name:'竹の径',   x:75, y:25, active:false },
  { name:'向日神社', x:25, y:75, active:false },
];

/* --- 状態 --- */
const cleared = new Set();   // クリア済みスポット
let progress = 0;            // 進捗度(%)
let current = null;          // 再生中のシーン
let lineNo = 0;

const $ = id => document.getElementById(id);

/* --- 画面切り替え(全画面を隠して、指定した1つだけ表示) --- */
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  $('hud').classList.toggle('show', ['home','map','chat'].includes(id));
  $('menu').classList.remove('open');
  if(id==='map') drawMap();
}

/* --- 会話シーン(テキストを1行ずつ進める) --- */
function playScene(key){
  current = SCENES[key]; lineNo = 0;
  $('sceneChars').innerHTML = charaHTML(current.chars);
  $('sceneText').textContent = current.lines[0];
  show('scene');
}
function nextLine(){
  lineNo++;
  if(lineNo < current.lines.length){ $('sceneText').textContent = current.lines[lineNo]; }
  else { current.next(); }
}

/* --- 進捗バー --- */
function setProgress(p){
  progress = p;
  $('barFill').style.width = p + '%';
  $('pct').textContent = p + '%';
}

/* --- マップ描画 --- */
function drawMap(){
  $('mapArea').innerHTML = SPOTS.map((s,i) => {
    const open = s.active && (!s.after || cleared.has(s.after)) && !cleared.has(s.name);
    return `<button class="pin ${open?'':'locked'}" style="left:${s.x}%;top:${s.y}%" ${open?`onclick="pickSpot(${i})"`:'disabled'}>
      <span>${s.name}${cleared.has(s.name)?' ✔':''}</span>📍</button>`;
  }).join('');
}
function pickSpot(i){ playScene(SPOTS[i].scene); }  // ピンを押す → ストーリーが進む

/* --- メニュー --- */
function toggleMenu(){ $('menu').classList.toggle('open'); }
function goMenu(id){ show(id); }

/* --- 会話(AIチャット) --- */
/* ★AI担当の人は、この askAI だけ差し替えればOK。今は仮の返事を返している */
async function askAI(text){
  return 'ここにAIの返事が入ります。(受け取った言葉:' + text + ')';
}
async function sendChat(){
  const input = $('chatInput'); const text = input.value.trim();
  if(!text) return;
  input.value = '';
  addLog('あなた', text);
  addLog('かぐや', await askAI(text));
}
function addLog(who, text){
  const p = document.createElement('p');
  p.textContent = who + ':' + text;   // textContentを使うと入力がそのまま安全に表示される
  $('log').appendChild(p);
  $('log').scrollTop = $('log').scrollHeight;
}

/* --- ゲーム開始 --- */
function startGame(){ playScene('prologue'); }

/* 起動時の初期表示 */
$('titleChara').innerHTML = charaHTML(['かぐや']);
$('homeChara').innerHTML = stick(CHARA['かぐや']);
</script>
</body>
</html>
